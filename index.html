<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portafoglio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f8;--surf:#fff;--ink:#14213d;--mut:#667389;--line:#dde3ea;--pf:#0b5fd6;--bm:#d98200;--up:#0f8a5f;--dn:#c93a3a;--sel:#14213d;--selt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1520;--surf:#152131;--ink:#e8eef6;--mut:#8b9ab0;--line:#24344a;--pf:#5aa2ff;--bm:#f0a63a;--up:#3ccf93;--dn:#ff7676;--sel:#e8eef6;--selt:#0d1520;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1520;--surf:#152131;--ink:#e8eef6;--mut:#8b9ab0;--line:#24344a;--pf:#5aa2ff;--bm:#f0a63a;--up:#3ccf93;--dn:#ff7676;--sel:#e8eef6;--selt:#0d1520;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums;line-height:1.4}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:1.1rem;margin:0;font-weight:600}
.badge{font-size:.75rem;color:var(--bm);border:1px solid var(--bm);border-radius:99px;padding:2px 10px}
.hero p{margin:0;color:var(--mut);font-size:.9rem}
.delta{font-size:3rem;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin:2px 0}
.up{color:var(--up)}.dn{color:var(--dn)}
.row{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-size:.85rem;padding:7px 13px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--selt);border-color:var(--sel)}
.chip:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--pf);outline-offset:2px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
svg{width:100%;height:auto;display:block}
.leg{display:flex;justify-content:space-between;font-size:.85rem;margin-top:8px}
.leg span::before{content:"";display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--c)}
.tot{display:flex;justify-content:space-between;align-items:baseline}
.tot b{font-size:1.5rem;font-weight:600}
.pos{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pos:first-of-type{border-top:0}
.pos small{color:var(--mut);display:block}
.pos .r{text-align:right}
.x{border:0;background:none;color:var(--mut);font-size:1.2rem;cursor:pointer;padding:4px 8px}
h2{font-size:.95rem;margin:0 0 4px;font-weight:600}
.add{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;margin-top:8px}
input{font:inherit;font-size:16px;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.btn{grid-column:1/-1;border:0;background:var(--pf);color:var(--bg);font:inherit;font-weight:600;padding:11px;border-radius:10px;cursor:pointer}
.err{grid-column:1/-1;color:var(--dn);font-size:.85rem;min-height:1em}
.note{color:var(--mut);font-size:.8rem;margin-top:14px}
.z{color:var(--mut)}.seg{display:flex;gap:8px;margin-bottom:12px}.seg .chip{flex:1;text-align:center}.tot b.s{font-size:1.15rem}.pos .up{color:var(--up)}.pos .dn{color:var(--dn)}.pos .z{color:var(--mut)}.pos .r{white-space:nowrap}.pos b{font-size:.95rem}
.pos.t{grid-template-columns:minmax(0,1fr) auto;gap:12px}.pos.d{grid-template-columns:minmax(0,1fr) 80px auto;gap:10px}
.nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25;font-weight:600;font-size:.95rem;word-break:break-word}.id small{white-space:nowrap;margin-top:2px}.sp,.sp svg{display:block;width:64px;height:34px}.pos .r small{font-size:.88rem;font-weight:600}
.pill{display:inline-block;margin-left:6px;padding:0 8px;border:1px solid var(--line);border-radius:99px;font-size:.78rem;color:var(--ink)}
.pl{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:0 8px;align-items:baseline}
.pos .pl small{display:inline}
.pos .r>b{display:block}
.pc{display:inline-block;margin-top:4px;padding:1px 9px;border-radius:6px;font-size:.88rem;font-weight:600;background:var(--mut)}
.pos .pc,.pos .pc.up,.pos .pc.dn,.pos .pc.z{color:var(--bg)}
.pc.up{background:var(--up)}.pc.dn{background:var(--dn)}
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.ov[hidden]{display:none}.ovi{max-width:480px;margin:0 auto}
.ovh{display:flex;align-items:center;gap:12px;margin-bottom:6px}.ovh h2{margin:0;font-size:1.1rem}
.back{border:0;background:none;color:var(--pf);font:inherit;font-size:1rem;cursor:pointer;padding:6px 0}
label{display:block;margin-top:14px;font-size:.85rem;color:var(--mut)}label input{margin-top:5px;color:var(--ink)}
.sug{border:1px solid var(--line);border-radius:10px;background:var(--surf);margin-top:6px;overflow:hidden}.sug:empty{display:none}
.sug button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer}
.sug button:first-child{border-top:0}.sug small{display:block;color:var(--mut);font-size:.8rem}
.ov .btn,.add2{display:block;width:100%;margin-top:16px}
#addv{z-index:30}
.nm2{font-size:1.25rem;font-weight:700;line-height:1.2}.mut{color:var(--mut)}
.big{font-size:1.6rem;font-weight:700;margin-top:6px}.big .pc{font-size:.95rem;vertical-align:middle;margin-top:0}
.op{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.op:first-child{border-top:0}.op small{display:block;color:var(--mut)}.op .r{text-align:right;white-space:nowrap}
.pos{cursor:pointer}
.two{display:flex;gap:8px;margin-top:12px}.two button{flex:1}.two .btn{width:auto;margin-top:0}
.btn.alt{background:var(--sel);color:var(--selt)}
.danger{display:block;width:100%;margin-top:14px;background:none;border:1px solid var(--dn);color:var(--dn);border-radius:10px;padding:11px;font:inherit;font-weight:600;cursor:pointer}.danger[hidden]{display:none}
.seg.six .chip{padding:7px 2px;font-size:.8rem}
#dleg{flex-wrap:wrap;gap:4px 14px;justify-content:flex-start}#dchg{margin-bottom:6px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--sel);color:var(--selt);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;max-width:448px;margin:0 auto}.toast[hidden]{display:none}.toast button{background:none;border:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<main>
<header><h1>Il mio portafoglio</h1><span class="badge" id="bdg">Caricamento…</span></header>
<section class="hero">
<p id="hl">Rispetto a S&amp;P 500</p>
<div class="delta" id="delta">–</div>
<p id="sub"></p>
</section>
<div class="row" id="bms" role="group" aria-label="Benchmark"></div>
<div class="row" id="pds" role="group" aria-label="Periodo"></div>
<div class="card">
<svg id="ch" viewBox="0 0 340 190" role="img" aria-label="Grafico del portafoglio e del benchmark in base 100"></svg>
<div class="leg"><span style="--c:var(--pf)" id="lp"></span><span style="--c:var(--bm)" id="lb"></span></div>
</div>
<div class="card">
<div class="seg" id="vw" role="group" aria-label="Visualizzazione"></div>
<div class="tot"><span>Valore</span><b id="val"></b></div>
<div class="tot"><span>Profitto/perdita</span><b id="spl" class="s"></b></div>
<div class="tot"><span>Variazione</span><b id="spp" class="s"></b></div>
</div>
<div class="card">
<h2 id="hdr">Posizioni</h2>
<div id="list"></div>
<button class="btn add2" id="addb">+ Aggiungi posizione</button>
</div>
<div class="card"><h2>Backup</h2><div class="two"><button class="chip" id="exp">Esporta CSV</button><button class="chip" id="impb">Importa CSV</button></div><input type="file" id="imp" accept=".csv,text/csv,text/plain,.txt" hidden></div>
</main>
<div id="detv" class="ov" hidden><div class="ovi">
<div class="ovh"><button class="back" id="dback">‹ Indietro</button></div>
<div id="dhead"></div>
<div class="seg six" id="dpd" role="group" aria-label="Periodo del grafico" style="margin-top:12px"></div>
<div class="card"><div id="dchg"></div><svg id="dch" viewBox="0 0 340 170" role="img" aria-label="Andamento del prezzo del titolo"></svg><div class="leg" id="dleg"></div></div>
<div class="card" id="dsum"></div>
<div class="card"><h2>Operazioni</h2><div id="dops"></div>
<div class="two"><button class="btn" id="dbuy">Aggiungi acquisto</button><button class="btn alt" id="dsell">Registra vendita</button></div>
<button class="danger" id="ddel">Elimina posizione</button></div>
</div></div>
<div id="addv" class="ov" hidden><div class="ovi">
<div class="ovh"><button class="back" id="canc">‹ Annulla</button><h2 id="ftit">Nuova posizione</h2></div>
<label>Titolo<input id="s" placeholder="Cerca per nome o ticker" autocomplete="off" autocapitalize="off"></label>
<div class="sug" id="sug"></div>
<label>Quantità<input id="q" inputmode="decimal" placeholder="Es. 10"></label>
<label><span id="lpr">Prezzo di acquisto (€)</span><input id="c" inputmode="decimal" placeholder="Es. 150,00"></label>
<label><span id="ldt">Data di acquisto</span><input id="dt" type="date"></label>
<div class="err" id="err" role="alert"></div>
<button class="btn" id="save">Salva</button>
<button class="danger" id="fdel" hidden>Elimina operazione</button>
</div></div>
<div id="toast" class="toast" hidden><span id="tmsg"></span><button id="tund">Annulla</button></div>
<script>
var BMS={SPX:{n:"S&P 500",b:1,mu:.0004,sg:.004,a:5900},NDX:{n:"Nasdaq 100",b:1.25,mu:.0006,sg:.006,a:20500},MSCI:{n:"MSCI World",b:.9,mu:.0003,sg:.003,a:3800},FTSE:{n:"FTSE All-World",b:.9,mu:.0003,sg:.0035,a:480}};
var PDS=[["1M",21],["3M",63],["6M",126],["1A",252]];
var ANCH={AAPL:230,MSFT:420,NVDA:140,"VWCE.DE":130,"IWDA.AS":105,TSLA:250};
var N=253,state={lots:[],pos:[],bm:"SPX",pd:126};
try{var sv=JSON.parse(localStorage.getItem("pf1")||"null");if(sv&&(sv.pos||sv.lots))state=sv}catch(e){}
state.view=state.view||"d";
if(!state.lots)state.lots=(state.pos||[]).map(function(o){return{s:o.s,d:"",q:o.q,c:o.c}});
agg();
function save(){try{localStorage.setItem("pf1",JSON.stringify({lots:state.lots,bm:state.bm,pd:state.pd,view:state.view}))}catch(e){}}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

var mk=(function(){var r=rng(42),a=[];for(var i=0;i<N;i++)a.push(gauss(r));return a})();
var cache={};
function gen(key,mu,sg,beta,anchor){
 if(cache[key])return cache[key];
 var r=rng(hash(key)),p=[100];
 for(var i=1;i<N;i++)p.push(p[i-1]*(1+mu+beta*.009*mk[i]+sg*gauss(r)));
 var k=anchor/p[N-1];p=p.map(function(x){return x*k});cache[key]=p;return p}
function serie(s){var a=ANCH[s]||60+rng(hash(s))()*240;return gen(s,.0004,.011,1.05,a)}
function bser(k){var b=BMS[k];return gen(k,b.mu,b.sg,b.b,b.a)}
var live={};
var UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36",AXD=simDates();
function simDates(){var a=[],d=new Date();while(a.length<N){var w=d.getDay();if(w!==0&&w!==6)a.unshift(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"));d.setDate(d.getDate()-1)}return a}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dmy(s){var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function sorted(L){return L.map(function(l,i){return{l:l,i:i}}).sort(function(a,b){return(a.l.d||"").localeCompare(b.l.d||"")||((a.l.k==="s")-(b.l.k==="s"))||a.i-b.i}).map(function(x){return x.l})}
function valid(L){var q={};return sorted(L).every(function(l){var v=(q[l.s]||0)+(l.k==="s"?-l.q:l.q);q[l.s]=v;return v>-1e-9})}
function agg(){var m={},o=[];
 sorted(state.lots).forEach(function(l){var p=m[l.s];if(!p){p=m[l.s]={s:l.s,q:0,c:0,d:l.d,r:0,u:0};o.push(p)}
  if(l.k==="s"){p.r+=l.q*(l.c-p.c);p.u+=l.q*p.c;p.q-=l.q;if(p.q<1e-9)p.q=0}
  else{p.c=(p.q*p.c+l.q*l.c)/(p.q+l.q);p.q+=l.q;if(l.d<p.d)p.d=l.d}});
 state.all=o;state.pos=o.filter(function(p){return p.q>1e-9})}
function twr(st){
 var I=[],B=[],pv=0,s0=-1,b0=0,x=100,bm=bser(state.bm),L=AXD[N-1];
 for(var i=st;i<N;i++){var v=0,cf=0,hq={};
  state.lots.forEach(function(l){var d=l.d&&l.d>L?L:l.d;if(!d||d<=AXD[i]){hq[l.s]=(hq[l.s]||0)+(l.k==="s"?-l.q:l.q);if(d&&i>0&&d>AXD[i-1])cf+=(l.k==="s"?-1:1)*l.q*l.c}});
  for(var s in hq)v+=hq[s]*price(s,i);
  if(s0<0){if(v>0){s0=i;b0=bm[i];I.push(100);B.push(100);pv=v}}
  else{if(pv>1e-9)x*=(v-cf)/pv;I.push(x);B.push(bm[i]/b0*100);pv=v}}
 return{I:I,B:B,s0:s0}}
var REAL=false,YB={SPX:"^GSPC",NDX:"^NDX",MSCI:"IWDA.AS",FTSE:"VWCE.DE"};
function yf(sym){
 return fetch("https://query1.finance.yahoo.com/v8/finance/chart/"+encodeURIComponent(sym)+"?range=1y&interval=1d",{headers:{"User-Agent":"Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36"}}).then(function(r){
  if(!r.ok)throw new Error(sym);return r.json()}).then(function(j){
  var x=j.chart.result[0],q=x.indicators.quote[0].close,ad=(x.indicators.adjclose&&x.indicators.adjclose[0].adjclose)||q,c={},a={};
  x.timestamp.forEach(function(t,i){if(q[i]==null)return;var d=new Date(t*1000).toISOString().slice(0,10);c[d]=q[i];a[d]=ad[i]==null?q[i]:ad[i]});
  return{c:c,a:a,last:x.meta.regularMarketPrice,cur:x.meta.currency,nm:x.meta.longName||x.meta.shortName||""}})}
function yfi(sym){
 return fetch("https://query1.finance.yahoo.com/v8/finance/chart/"+encodeURIComponent(sym)+"?range=1d&interval=5m",{headers:{"User-Agent":"Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36"}}).then(function(r){if(!r.ok)throw new Error(sym);return r.json()}).then(function(j){
  var x=j.chart.result[0],q=x.indicators.quote[0].close,p=[];
  (x.timestamp||[]).forEach(function(t,i){if(q[i]!=null)p.push([t,q[i]])});return p}).catch(function(){return[]})}
function cur(c){return c==="GBp"||c==="GBX"?"GBP":c}
function kf(c){return c==="GBp"||c==="GBX"?.01:1}
function ecb(u){
 return fetch("https://data-api.ecb.europa.eu/service/data/EXR/D."+u+".EUR.SP00.A?lastNObservations=300&format=csvdata").then(function(r){if(!r.ok)throw new Error(u);return r.text()}).then(function(t){
  var L=t.trim().split(/\r?\n/),h=L[0].split(","),ti=h.indexOf("TIME_PERIOD"),vi=h.indexOf("OBS_VALUE"),c={};
  L.slice(1).forEach(function(l){var p=l.split(",");if(p[vi]&&p[ti])c[p[ti]]=parseFloat(p[vi])});
  if(!Object.keys(c).length)throw new Error(u);return{c:c}})}
function loadAll(extra){
 var syms=state.all.map(function(o){return o.s});if(extra)syms.push(extra);
 syms=syms.filter(function(s,i){return syms.indexOf(s)===i});
 var bk=Object.keys(YB),jobs=syms.concat(bk.map(function(k){return YB[k]}));
 return Promise.all(jobs.map(yf)).then(function(R){
  var cs={};R.forEach(function(r){var u=cur(r.cur);if(u!=="EUR")cs[u]=1});
  var cl=Object.keys(cs);
  return Promise.all([Promise.all(cl.map(function(u){return ecb(u).catch(function(){return yf("EUR"+u+"=X")})})),Promise.all(syms.map(yfi))]).then(function(w){return[R,cl,w[0],w[1]]})
 }).then(function(z){var R=z[0],cl=z[1],F=z[2],IT=z[3];
  var set={};R.forEach(function(r){Object.keys(r.c).forEach(function(d){set[d]=1})});
  var ax=Object.keys(set).sort().slice(-253);
  function al(m){var out=[],l=null;ax.forEach(function(d){if(m[d]!=null)l=m[d];out.push(l)});var f=out.find(function(v){return v!=null});return out.map(function(v){return v==null?f:v})}
  var nc={};
  var fx={};cl.forEach(function(u,i){var f=F[i],ks=Object.keys(f.c).sort();if(f.last)f.c[ks[ks.length-1]]=f.last;fx[u]=al(f.c);if(f.last)fx[u][fx[u].length-1]=f.last});
  function toE(arr,c){var u=cur(c);if(u==="EUR")return arr;var k=kf(c);return arr.map(function(v,i){return v*k/fx[u][i]})}
  var ni={};
  syms.forEach(function(s,i){var r=R[i],ks=Object.keys(r.c).sort(),ln=ks.length,cu=r.last||r.c[ks[ln-1]],pd=ks[ln-2],pr=r.c[pd]||cu,u=cur(r.cur),k=kf(r.cur),ix=ax.indexOf(pd),fp=(u==="EUR")?1:fx[u][ix<0?ax.length-1:ix];
   ni[s]={nat:cu,cs:SY[r.cur]||r.cur,pct:(cu/pr-1)*100,pe:pr*k/fp,name:r.nm||s,sp:IT[i]||[],base:pr}});
  syms.forEach(function(s,i){var r=R[i],ks=Object.keys(r.c).sort();if(r.last)r.c[ks[ks.length-1]]=r.last;nc[s]=toE(al(r.c),r.cur)});
  bk.forEach(function(k,i){var r=R[syms.length+i];nc[k]=toE(al(r.a),r.cur)});
  cache=nc;INFO=ni;N=ax.length;AXD=ax;REAL=true})}
function price(s,i){var p=serie(s);return i===N-1&&!REAL?p[i]*(1+(live[s]||0)):p[i]}
function grp(s){return s.replace(/\B(?=(\d{3})+(?!\d))/g,".")}
function fmt(x,d){var n=Math.abs(x).toFixed(d).split(".");return(x<0&&+n.join(".")!==0?"−":"")+grp(n[0])+(n[1]?","+n[1]:"")}
function spark(p,b,c){
 if(!p||p.length<2)return"";
 var W=64,H=34,t0=p[0][0],t1=p[p.length-1][0],mn=b,mx=b;
 p.forEach(function(q){if(q[1]<mn)mn=q[1];if(q[1]>mx)mx=q[1]});
 var pd=(mx-mn)*.1||1;mn-=pd;mx+=pd;
 function X(t){return(t-t0)/((t1-t0)||1)*W}
