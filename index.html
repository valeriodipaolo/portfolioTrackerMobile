<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portafoglio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f8;--surf:#fff;--ink:#14213d;--mut:#667389;--line:#dde3ea;--pf:#0b5fd6;--bm:#d98200;--up:#0f8a5f;--dn:#c93a3a;--sel:#14213d;--selt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1520;--surf:#152131;--ink:#e8eef6;--mut:#8b9ab0;--line:#24344a;--pf:#5aa2ff;--bm:#f0a63a;--up:#3ccf93;--dn:#ff7676;--sel:#e8eef6;--selt:#0d1520;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1520;--surf:#152131;--ink:#e8eef6;--mut:#8b9ab0;--line:#24344a;--pf:#5aa2ff;--bm:#f0a63a;--up:#3ccf93;--dn:#ff7676;--sel:#e8eef6;--selt:#0d1520;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums;line-height:1.4}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:1.1rem;margin:0;font-weight:600}
.badge{font-size:.75rem;color:var(--bm);border:1px solid var(--bm);border-radius:99px;padding:2px 10px}
.hero p{margin:0;color:var(--mut);font-size:.9rem}
.delta{font-size:3rem;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin:2px 0}
.up{color:var(--up)}.dn{color:var(--dn)}
.row{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip:disabled{opacity:.35;pointer-events:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-size:.85rem;padding:7px 13px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--selt);border-color:var(--sel)}
.chip:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--pf);outline-offset:2px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
svg{width:100%;height:auto;display:block}
.leg{display:flex;justify-content:space-between;font-size:.85rem;margin-top:8px}
.leg span::before{content:"";display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--c)}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.kt{border:1px solid var(--line);border-radius:10px;padding:8px}.kt small{display:block;color:var(--mut);font-size:.72rem}.kt b{font-size:.95rem;font-weight:600}.kt b.up{color:var(--up)}.kt b.dn{color:var(--dn)}
.cb{margin-top:12px}.cb .cl{display:grid;grid-template-columns:minmax(0,1fr) 3.4rem 7rem;gap:8px;align-items:baseline;font-size:.88rem}.cb .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cb .cp{text-align:right;font-weight:700;white-space:nowrap}.cb .ca{text-align:right;color:var(--mut);white-space:nowrap;font-size:.82rem}.cb .tk{height:6px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden}.cb .tk i{display:block;height:100%;border-radius:3px;background:var(--pf)}
.tot{display:flex;justify-content:space-between;align-items:baseline}
.tot b{font-size:1.5rem;font-weight:600}
.pos{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pos:first-of-type{border-top:0}
.pos small{color:var(--mut);display:block}
.pos .r{text-align:right}
.x{border:0;background:none;color:var(--mut);font-size:1.2rem;cursor:pointer;padding:4px 8px}
h2{font-size:.95rem;margin:0 0 4px;font-weight:600}
.add{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;margin-top:8px}
input{font:inherit;font-size:16px;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.btn{grid-column:1/-1;border:0;background:var(--pf);color:var(--bg);font:inherit;font-weight:600;padding:11px;border-radius:10px;cursor:pointer}
.err{grid-column:1/-1;color:var(--dn);font-size:.85rem;min-height:1em}
.note{color:var(--mut);font-size:.8rem;margin-top:14px}
.z{color:var(--mut)}.seg{display:flex;gap:8px;margin-bottom:12px}.seg .chip{flex:1;text-align:center}.tot b.s{font-size:1.15rem}.pos .up{color:var(--up)}.pos .dn{color:var(--dn)}.pos .z{color:var(--mut)}.pos .r{white-space:nowrap}.pos b{font-size:.95rem}
.pos.t{grid-template-columns:minmax(0,1fr) auto;gap:12px}.pos.d{grid-template-columns:minmax(0,1fr) 80px auto;gap:10px}
.nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25;font-weight:600;font-size:.95rem;word-break:break-word}.id small{white-space:nowrap;margin-top:2px}.sp,.sp svg{display:block;width:64px;height:34px}.pos .r small{font-size:.88rem;font-weight:600}
.pill{display:inline-block;margin-left:6px;padding:0 8px;border:1px solid var(--line);border-radius:99px;font-size:.78rem;color:var(--ink)}
.pl{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:0 8px;align-items:baseline}
.pos .pl small{display:inline}
.pos .r>b{display:block}
.pc{display:inline-block;margin-top:4px;padding:1px 9px;border-radius:6px;font-size:.88rem;font-weight:600;background:var(--mut)}
.pos .pc,.pos .pc.up,.pos .pc.dn,.pos .pc.z{color:var(--bg)}
.pc.up{background:var(--up)}.pc.dn{background:var(--dn)}
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.ov[hidden]{display:none}.ovi{max-width:480px;margin:0 auto}
.ovh{display:flex;align-items:center;gap:12px;margin-bottom:6px}.ovh h2{margin:0;font-size:1.1rem}
.back{border:0;background:none;color:var(--pf);font:inherit;font-size:1rem;cursor:pointer;padding:6px 0}
label{display:block;margin-top:14px;font-size:.85rem;color:var(--mut)}label input{margin-top:5px;color:var(--ink)}
.sug{border:1px solid var(--line);border-radius:10px;background:var(--surf);margin-top:6px;overflow:hidden}.sug:empty{display:none}
.sug button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer}
.sug button:first-child{border-top:0}.sug small{display:block;color:var(--mut);font-size:.8rem}
.ov .btn,.add2{display:block;width:100%;margin-top:16px}
#addv{z-index:30}
.nm2{font-size:1.25rem;font-weight:700;line-height:1.2}.mut{color:var(--mut)}
.big{font-size:1.6rem;font-weight:700;margin-top:6px}.big .pc{font-size:.95rem;vertical-align:middle;margin-top:0}
.op{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.op:first-child{border-top:0}.op small{display:block;color:var(--mut)}.op .r{text-align:right;white-space:nowrap}
.pos{cursor:pointer}
.two{display:flex;gap:8px;margin-top:12px}.two button{flex:1}.two .btn{width:auto;margin-top:0}
.btn.alt{background:var(--sel);color:var(--selt)}
.danger{display:block;width:100%;margin-top:14px;background:none;border:1px solid var(--dn);color:var(--dn);border-radius:10px;padding:11px;font:inherit;font-weight:600;cursor:pointer}.danger[hidden]{display:none}
.seg.six .chip{padding:7px 2px;font-size:.8rem}
#dchg{margin-bottom:6px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--sel);color:var(--selt);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;max-width:448px;margin:0 auto}.toast[hidden]{display:none}.toast button{background:none;border:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.pc,.pc.up,.pc.dn,.pc.z{color:var(--bg)}
.pos.d{grid-template-columns:minmax(0,1fr) 80px 108px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}.ph h2{margin:0}.phb{display:flex;gap:6px}.sm{padding:5px 10px;font-size:.78rem}
.pos.ro{grid-template-columns:minmax(0,1fr) auto;cursor:default}.mv{display:flex;gap:6px}
.mvb{width:44px;height:40px;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:10px;font-size:1rem;cursor:pointer}
.phb{flex-wrap:wrap;margin:4px 0 6px}
.mkt{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;box-sizing:border-box}
.mkt.on{background:var(--up);box-shadow:0 0 0 3px color-mix(in srgb,var(--up) 25%,transparent)}.mkt.off{border:1.5px solid var(--mut)}
.gh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 10px;margin:10px 0 2px;border-radius:12px;background:var(--bg);cursor:pointer}.gh:first-child{margin-top:0}.gh+.pos{border-top:0}
.gt{display:flex;align-items:center;gap:8px;min-width:0}.gt b{display:block}.gt small{display:block;color:var(--mut)}.chev{color:var(--mut);width:12px;flex:none}
.gh .r{text-align:right;white-space:nowrap}.gh .r b{display:block}
.ga{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}.ga .gb{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:.8rem;cursor:pointer}
select{font:inherit;font-size:16px;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%;margin-top:5px}
.grp{border:1px solid var(--line);border-left:5px solid var(--gc);border-radius:12px;overflow:hidden;margin-top:12px}
.grp:first-child{margin-top:0}
.grp .gh{margin:0;border-radius:0;background:color-mix(in srgb,var(--gc) 16%,var(--surf));padding:12px}
.grp .pos{padding-left:12px;padding-right:12px}
.seg.ei{gap:5px}.seg.ei .chip{padding:7px 2px;font-size:.74rem}
.leg{flex-wrap:wrap;gap:6px 14px;justify-content:flex-start}
.bd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.chk{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:.85rem;color:var(--mut)}.chk input{width:auto;margin:0}
.tot b.sm{font-size:.95rem;white-space:nowrap}
.cr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.cr:first-child{border-top:0}.cr small{display:block;color:var(--mut)}.cr .r{text-align:right;white-space:nowrap}
</style>
</head>
<body>
<main>
<header><h1>Il mio portafoglio</h1><span class="badge" id="bdg">Caricamento…</span></header>
<div class="row" id="bms" role="group" aria-label="Benchmark"></div>
<div class="seg ei" id="pds" role="group" aria-label="Periodo" style="margin-top:8px"></div><div id="pdc" hidden style="display:flex;gap:8px;align-items:center;margin:8px 0"><label style="margin:0">Da <input type="date" id="pdf"></label><label style="margin:0">A <input type="date" id="pdt"></label></div>
<div class="card">
<svg id="ch" viewBox="0 0 340 190" role="img" aria-label="Grafico del portafoglio e del benchmark in base 100"></svg>
<div class="leg" id="lg"></div>
</div>
<div class="card">
<div class="tot"><span>Valore</span><b id="val"></b></div>
<div class="tot"><span>Profitto/perdita</span><b id="spl" class="s"></b></div>
<div class="tot"><span>Rendimento</span><b id="spp" class="s"></b></div>
</div>
<div class="card"><h2>Composizione</h2><div class="seg" id="cseg" style="margin-top:8px"></div><div id="comp"></div></div>
<div class="card">
<div class="ph"><h2 id="hdr">Posizioni</h2></div><div class="phb"><button class="chip sm" id="lay">Vista: elenco</button><button class="chip sm" id="srt">Ordine: manuale</button><button class="chip sm" id="reo">Riordina</button><button class="chip sm" id="ngr" hidden>+ Nuovo gruppo</button></div>
<div id="list"></div>
<button class="btn add2" id="addb">+ Aggiungi posizione</button>
</div>
<div class="card"><h2>Titoli osservati</h2><div id="wlist"></div><button class="chip" id="waddb" style="margin-top:10px">+ Osserva un titolo</button></div>
<div class="card"><h2>Impostazioni e backup</h2><div class="two"><button class="chip" id="exp">Esporta CSV</button><button class="chip" id="impb">Importa CSV</button></div>
<label class="chk"><input type="checkbox" id="cashr"><span>Includi la liquidità nei rendimenti</span></label><input type="file" id="imp" accept=".csv,text/csv,text/plain,.txt" hidden>
<small class="mut" id="bkst" style="display:block;margin-top:8px"></small>
<button class="chip" id="diagb" style="margin-top:10px">Diagnostica dati</button><pre id="diagp" hidden style="white-space:pre-wrap;word-break:break-all;font-size:.68rem;margin:10px 0 0;color:var(--mut)"></pre></div>
</main>
<div id="detv" class="ov" hidden><div class="ovi">
<div class="ovh"><button class="back" id="dback">‹ Indietro</button></div>
<div id="dhead"></div>
<div class="row" id="dbm" role="group" aria-label="Benchmark" style="margin-top:4px"></div>
<div class="seg ei" id="dpd" role="group" aria-label="Periodo del grafico" style="margin-top:8px"></div><div id="dpc" hidden style="display:flex;gap:8px;align-items:center;margin:8px 0"><label style="margin:0">Da <input type="date" id="dpf"></label><label style="margin:0">A <input type="date" id="dpt"></label></div>
<div class="card" id="dchc"><div id="dchg"></div><svg id="dch" viewBox="0 0 340 170" role="img" aria-label="Andamento del prezzo del titolo"></svg></div>
<div class="card" id="dkc"></div>
<div class="card" id="dgc"></div>
<div class="card" id="dgrc"><label style="margin-top:0"><span>Gruppo</span><select id="dgrp"></select></label></div>
<div class="card" id="dwc" hidden><div class="two"><button class="btn" id="dwbuy">Aggiungi acquisto</button><button class="btn alt" id="dwrm">Non osservare più</button></div></div>
<div class="card" id="dsum"></div>

<div class="card" id="dopc"><h2>Operazioni</h2><div id="dops"></div>
<div class="two"><button class="btn" id="dbuy">Aggiungi acquisto</button><button class="btn alt" id="dsell">Registra vendita</button></div>
<button class="danger" id="ddel">Elimina posizione</button></div>
</div></div>
<div id="addv" class="ov" hidden><div class="ovi">
<div class="ovh"><button class="back" id="canc">‹ Annulla</button><h2 id="ftit">Nuova posizione</h2></div>
<div class="seg" id="ftype" style="margin-top:10px"><button class="chip" id="ft1" aria-pressed="true">Titolo di Yahoo</button><button class="chip" id="ft2" aria-pressed="false">Importo manuale</button><button class="chip" id="ft3" aria-pressed="false">Solo osservare</button></div>
<label><span id="lti">Titolo</span><input id="s" placeholder="Cerca per nome o ticker" autocomplete="off" autocapitalize="off"></label>
<div class="sug" id="sug"></div>
<label><span id="lq">Quantità</span><input id="q" inputmode="decimal" placeholder="Es. 10"></label>
<label id="lcw"><span id="lpr">Prezzo di acquisto (€)</span><input id="c" inputmode="decimal" placeholder="Es. 150,00"></label>
<label><span id="ldt">Data di acquisto</span><input id="dt" type="date"></label>
<div class="err" id="err" role="alert"></div>
<button class="btn" id="save">Salva</button>
<button class="danger" id="fdel" hidden>Elimina operazione</button>
</div></div>

<div id="toast" class="toast" hidden><span id="tmsg"></span><button id="tund">Annulla</button></div>
<script>
var BMS={SPX:{n:"S&P 500",b:1,mu:.0004,sg:.004,a:5900},NDX:{n:"Nasdaq 100",b:1.25,mu:.0006,sg:.006,a:20500},MSCI:{n:"MSCI World",b:.9,mu:.0003,sg:.003,a:3800},FTSE:{n:"FTSE All-World",b:.9,mu:.0003,sg:.0035,a:480}};
var PERS=["1G","5G","1M","6M","YTD","1A","5A","TUTTO","CUSTOM"];var PLBL={CUSTOM:"Personalizzato"};
BMS.SPX.col="#f59e0b";BMS.NDX.col="#a855f7";BMS.MSCI.col="#06b6d4";BMS.FTSE.col="#ec4899";

var ANCH={AAPL:230,MSFT:420,NVDA:140,"VWCE.DE":130,"IWDA.AS":105,TSLA:250};
var N=253,state={lots:[],pos:[],bms:["SPX"],pd:"6M"};
try{var sv=JSON.parse(localStorage.getItem("pf1")||"null");if(sv&&(sv.pos||sv.lots))state=sv}catch(e){}
if(!state.bms)state.bms=[state.bm||"SPX"];if(typeof state.pd!=="string"||PERS.indexOf(state.pd)<0)state.pd="6M";if(!state.pdFrom||!state.pdTo){var _d=new Date();_d.setMonth(_d.getMonth()-1);state.pdFrom=state.pdFrom||_d.toISOString().slice(0,10);state.pdTo=state.pdTo||today();}
state.sort=state.sort||"m";state.order=state.order||[];state.man=state.man||{};state.groups=state.groups||[];state.gmap=state.gmap||{};state.layout=state.layout||"f";state.coll=state.coll||{};state.watch=state.watch||[];state.cmode=state.cmode||"t";
if(!state.lots)state.lots=(state.pos||[]).map(function(o){return{s:o.s,d:"",q:o.q,c:o.c}});
agg();
function save(){SET={};try{localStorage.setItem("pf1",JSON.stringify({lots:state.lots,bms:state.bms,pd:state.pd,pdFrom:state.pdFrom,pdTo:state.pdTo,sort:state.sort,order:state.order,groups:state.groups,gmap:state.gmap,layout:state.layout,coll:state.coll,man:state.man,cashR:state.cashR,watch:state.watch,cmode:state.cmode}))}catch(e){}bkup()}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){return Math.sqrt(-2*Math.log(r()+1e-9))*Math.cos(6.2832*r())}
function hash(s){var h=7;for(var i=0;i<s.length;i++)h=Math.imul(h,31)+s.charCodeAt(i)|0;return h}
var mk=(function(){var r=rng(42),a=[];for(var i=0;i<N;i++)a.push(gauss(r));return a})();
var cache={};
function gen(key,mu,sg,beta,anchor){
 if(cache[key])return cache[key];
 var r=rng(hash(key)),p=[100];
 for(var i=1;i<N;i++)p.push(p[i-1]*(1+mu+beta*.009*mk[i]+sg*gauss(r)));
 var k=anchor/p[N-1];p=p.map(function(x){return x*k});cache[key]=p;return p}
function serie(s){var a=ANCH[s]||60+rng(hash(s))()*240;return gen(s,.0004,.011,1.05,a)}
function bser(k){var b=BMS[k];return gen(k,b.mu,b.sg,b.b,b.a)}
var live={};
var UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36",AXD=simDates();
function simDates(){var a=[],d=new Date();while(a.length<N){var w=d.getDay();if(w!==0&&w!==6)a.unshift(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"));d.setDate(d.getDate()-1)}return a}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dmy(s){var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function ord(){var h={},ok=function(x){return state.pos.some(function(p){return p.s===x})},a=(state.order||[]).filter(ok);a.forEach(function(x){h[x]=1});state.lots.forEach(function(l){if(!h[l.s]&&ok(l.s)){h[l.s]=1;a.push(l.s)}});return a}
function sortRows(rows,V){if(state.sort==="r")return rows.slice().sort(function(a,b){if(a.man!==b.man)return a.man?1:-1;return V?b.tp-a.tp:b.dp-a.dp});var o=ord();return rows.slice().sort(function(a,b){return o.indexOf(a.s)-o.indexOf(b.s)})}
function sorted(L){return L.map(function(l,i){return{l:l,i:i}}).sort(function(a,b){return(a.l.d||"").localeCompare(b.l.d||"")||((a.l.k==="s")-(b.l.k==="s"))||a.i-b.i}).map(function(x){return x.l})}
function valid(L){var q={};return sorted(L).every(function(l){var v=(q[l.s]||0)+(l.k==="s"?-l.q:l.q);q[l.s]=v;return v>-1e-9})}

 var sep=L[0].indexOf(";")>=0?";":",",h=L[0].toLowerCase().split(sep).map(function(x){return x.trim()}),hd=h.indexOf("ticker")>=0,ix={s:0,d:1,t:2,q:3,c:4,n:5};
 if(hd){ix={s:h.indexOf("ticker"),d:h.indexOf("data"),t:h.indexOf("tipo"),q:h.findIndex(function(x){return x.indexOf("quant")===0}),c:h.findIndex(function(x){return x.indexOf("prezzo")===0}),n:h.indexOf("nome")};L=L.slice(1)}
 var out=[],man={};
 for(var j=0;j<L.length;j++){var c=L[j].split(sep).map(function(x){return x.trim()}),s=(c[ix.s]||"").toUpperCase(),d=c[ix.d]||"",k=/^[vs]/i.test(c[ix.t]||"")?"s":"b",q=num(c[ix.q]||""),p=num(c[ix.c]||""),m=d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m)d=m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
  if(!/^[A-Z0-9.^=-]{1,12}$/.test(s)||!((d===""&&k==="b")||(/^\d{4}-\d{2}-\d{2}$/.test(d)&&d<=today()))||!(q>0)||!(p>0))return{err:"Riga "+(j+(hd?2:1))+" non valida: "+L[j]};
  if(isMan(s))man[s]=(c[ix.n]||"").slice(0,40)||"Liquidità";
  out.push({s:s,d:d,q:q,c:p,k:k})}
 return{rows:out,man:man}}

  P.Filesystem.writeFile({path:"portafoglio.csv",data:csv,directory:"CACHE",encoding:"utf8"}).then(function(){return P.Filesystem.getUri({path:"portafoglio.csv",directory:"CACHE"})}).then(function(u){return P.Share.share({title:"Portafoglio",files:[u.uri]})}).catch(function(e){if(!/cancel/i.test(String(e&&e.message||e)))alert("Esportazione non riuscita.")})
 }else{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="portafoglio.csv";document.body.appendChild(a);a.click();a.remove()}};

 L.push("","SEC: "+(SECERR?"ultimo errore: "+SECERR:"nessun errore"));p.textContent=L.join("\n");p.hidden=false;p.scrollIntoView()};
