name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verifica chiave esistente
        run: |
          ls -l debug.keystore
          sha256sum debug.keystore
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "Alias|SHA256"

      - name: Crea progetto Capacitor
        run: |
          mkdir -p www && cp index.html www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/app@6
          cat > capacitor.config.json <<'EOF'
          {"appId":"app.portafoglio.personale","appName":"Portafoglio","webDir":"www","plugins":{"CapacitorHttp":{"enabled":true}}}
          EOF
          npx cap add android
          npx cap sync android
          
          # Copia la tua chiave stabile dentro al modulo app
          cp debug.keystore android/app/debug.keystore

          # Incrementa versionCode per permettere l'update
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

          # Rimuove il vecchio signing di debug e inserisce il nostro
          # 1. Sostituisce il buildTypes con uno che usa la stessa chiave
          cat > android/app/build.gradle.fixed <<'EOF'
          EOF
          
          # Approccio più robusto: riscriviamo il blocco signingConfigs + buildTypes
          # usando un file di patch
          python3 << 'PY'
          import pathlib
          p = pathlib.Path("android/app/build.gradle").read_text()
          # rimuovi vecchi signingConfigs se presenti
          # inseriamo la nostra config subito prima di buildTypes
          stable_block = '''
              signingConfigs {
                  stable {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
                  debug {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          '''
          if "signingConfigs" in p:
              # se esiste già lo sostituiamo con il nostro - semplifichiamo: sostituisci la prima occorrenza di buildTypes {
              p = p.replace("buildTypes {", stable_block + "\n    buildTypes {")
              # forza tutte le build a usare stable
              p = p.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.stable")
              # se c'è ancora un debug che non ha firma, assicuriamoci
              if "signingConfig signingConfigs.stable" not in p:
                  p = p.replace("buildTypes {", "buildTypes {\n        debug {\n            signingConfig signingConfigs.stable\n        }\n        release {\n            signingConfig signingConfigs.stable\n        }")
          else:
              p = p.replace("buildTypes {", stable_block + "\n    buildTypes {")
              p = p.replace("buildTypes {", "buildTypes {\n        debug {\n            signingConfig signingConfigs.stable\n        }\n        release {\n            signingConfig signingConfigs.stable\n        }\n", 1) # evita duplicati, la prima replace ha già creato il blocco
              # Correggiamo doppio inserimento: teniamo solo quello dentro stable_block
              # Facciamo un replace finale pulito per buildTypes
              # Per sicurezza, forziamo release/debug nel buildTypes finale
              p = p.replace('signingConfigs.debug', 'signingConfigs.stable')

          pathlib.Path("android/app/build.gradle").write_text(p)
          print(p[ p.find("signingConfigs"): p.find("buildTypes {")+500 ])
          PY

          echo "--- build.gradle finale ---"
          grep -A 15 "signingConfigs" android/app/build.gradle

      - name: Compila APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Impronta della firma (deve essere sempre uguale)
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA256"
          echo "Keystore originale:"
          keytool -list -v -keystore debug.keystore -storepass android | grep -i "SHA256"

      - uses: actions/upload-artifact@v4
        with:
          name: portafoglio-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk